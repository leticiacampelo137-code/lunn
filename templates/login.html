<!DOCTYPE html>
{% load static %}
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Lunn</title>
    <link rel="stylesheet" href="{% static 'arquivos de css/theme.css' %}">
    <link rel="stylesheet" href="{% static 'arquivos de css/stylelongi.css' %}">
</head>
<body>
    <main class="auth-container">
        <div class="logotipo"><img src="{% static 'img/1791575863547.png' %}" alt="Logo do Lunn">Lunn </div>
        <section class="auth-card">
            <h1>Bem-vindo de volta!</h1>
            <p>Continue sua jornada de estudos.</p>

            <form id="form-login" method="post">
                <div class="form-group">
                     {% csrf_token %}
                     {% if error %}<p>{{ error }}</p>{% endif %}
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Entrar
                </button>
            </form>

            <p class="auth-footer">
                Ainda não tem uma conta?
                <a href="{% url 'pagina_cadastro' %}">Cadastre-se</a>
            </p>
        </section>
    </main>
</body>
</html>
